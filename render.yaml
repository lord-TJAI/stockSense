services:
  - type: web
    name: stocksense-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false            # Set in Render dashboard — Atlas connection string
      - key: JWT_ACCESS_SECRET
        generateValue: true    # Render generates a secure random value
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: "15m"
      - key: JWT_REFRESH_EXPIRY
        value: "7d"
      - key: CLIENT_URLS
        sync: false            # Set in Render dashboard — your Vercel URL (comma-separated)
      - key: EMAIL_PROVIDER
        value: mock            # Change to smtp for production email
      - key: EMAIL_FROM
        value: noreply@stocksense.dev
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
